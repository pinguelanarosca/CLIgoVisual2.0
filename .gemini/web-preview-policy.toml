# Web Preview Environment Policy to allow essential development tools in headless execution.
# This prevents tools from being blocked by default non-interactive / headless checks.

[[rule]]
name = "Allow All MCP Tools"
toolName = "mcp_*"
decision = "allow"
priority = 90

[[rule]]
name = "Allow All MCP Servers"
toolName = "*"
mcpName = "*"
decision = "allow"
priority = 90

[[rule]]
name = "Allow Essential Development Tools"
toolName = "*"
decision = "allow"
priority = 90
